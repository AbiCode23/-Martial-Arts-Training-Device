<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Exercise Counter</title>
    <style>
      :root {
        --primary-color: #4caf50;
        --secondary-color: #2196f3;
        --background-color: #f8f9fa;
        --card-bg: #ffffff;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: var(--background-color);
        min-height: 100vh;
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
      }

      .header {
        text-align: center;
        margin-bottom: 40px;
      }

      .header h1 {
        color: #333;
        font-size: 2.5em;
        margin-bottom: 10px;
      }

      .header p {
        color: #666;
        font-size: 1.1em;
      }

      .exercise-card {
        background: var(--card-bg);
        border-radius: 15px;
        padding: 25px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        margin-bottom: 30px;
      }

      .exercise-form {
        display: flex;
        flex-direction: column;
        gap: 20px;
        align-items: center;
      }

      .select-container {
        width: 100%;
        max-width: 300px;
      }

      select {
        width: 100%;
        padding: 12px;
        border: 2px solid #ddd;
        border-radius: 8px;
        font-size: 1.1em;
        background-color: white;
        cursor: pointer;
        transition: border-color 0.3s;
      }

      select:hover {
        border-color: var(--secondary-color);
      }

      button {
        background-color: var(--secondary-color);
        color: white;
        border: none;
        padding: 12px 30px;
        border-radius: 8px;
        font-size: 1.1em;
        cursor: pointer;
        transition: transform 0.2s, background-color 0.3s;
      }

      button:hover {
        background-color: #1976d2;
        transform: translateY(-2px);
      }

      .results-container {
        margin-top: 30px;
        text-align: center;
      }

      .stats-card {
        background: var(--card-bg);
        border-radius: 15px;
        padding: 25px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        margin-top: 20px;
      }

      .count-display {
        font-size: 3em;
        color: var(--primary-color);
        margin: 20px 0;
        font-weight: bold;
      }

      .exercise-info {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-top: 20px;
      }

      .info-box {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 10px;
        text-align: center;
      }

      .info-box h3 {
        margin: 0;
        color: #555;
        font-size: 1.1em;
      }

      .info-box p {
        margin: 10px 0 0;
        color: var(--secondary-color);
        font-size: 1.2em;
        font-weight: bold;
      }

      .status-indicator {
        display: inline-block;
        padding: 8px 15px;
        border-radius: 20px;
        background-color: #e0e0e0;
        color: #666;
        margin-top: 15px;
      }

      .status-indicator.active {
        background-color: var(--primary-color);
        color: white;
      }

      @media (max-width: 600px) {
        .container {
          padding: 10px;
        }

        .exercise-info {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Smart Exercise Counter</h1>
        <p>Track your exercises with real-time AI-powered counting</p>
      </div>

      <div class="exercise-card">
        <form id="exerciseForm" class="exercise-form">
          <div class="select-container">
            <select id="exerciseSelect" name="exercise">
              <option value="reps">Bicep Curls</option>
              <option value="squats">Squats</option>
              <option value="pushups">Push-ups</option>
            </select>
          </div>
          <button type="submit">Start Counting</button>
        </form>
      </div>

      <div class="stats-card">
        <div id="result" class="results-container">
          <div class="count-display">0</div>
          <div class="status-indicator">Ready to Start</div>
          <div class="exercise-info">
            <div class="info-box">
              <h3>Current Exercise</h3>
              <p id="currentExercise">Not Started</p>
            </div>
            <div class="info-box">
              <h3>Stage</h3>
              <p id="currentStage">-</p>
            </div>
            <div class="info-box">
              <h3>Time Elapsed</h3>
              <p id="timeElapsed">00:00</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      let startTime;
      let timerInterval;

      function updateTimer() {
        if (!startTime) return;
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const minutes = Math.floor(elapsed / 60)
          .toString()
          .padStart(2, "0");
        const seconds = (elapsed % 60).toString().padStart(2, "0");
        document.getElementById(
          "timeElapsed"
        ).textContent = `${minutes}:${seconds}`;
      }

      document
        .getElementById("exerciseForm")
        .addEventListener("submit", function (event) {
          event.preventDefault();

          // Reset and start timer
          clearInterval(timerInterval);
          startTime = Date.now();
          timerInterval = setInterval(updateTimer, 1000);

          // Update UI elements
          const exercise = document.getElementById("exerciseSelect").value;
          document.getElementById("currentExercise").textContent =
            exercise === "reps"
              ? "Bicep Curls"
              : exercise === "squats"
              ? "Squats"
              : "Push-ups";

          document.querySelector(".status-indicator").textContent =
            "Counting in Progress";
          document.querySelector(".status-indicator").classList.add("active");

          // Make the API call
          var formData = new FormData(this);
          fetch("/count_exercise", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Accept: "application/json",
            },
            body: JSON.stringify(Object.fromEntries(formData)),
          })
            .then((response) => response.json())
            .then((data) => {
              document.querySelector(".count-display").textContent = data.count;
              document.getElementById("currentStage").textContent = "Complete";
              document.querySelector(".status-indicator").textContent =
                "Exercise Complete";
              clearInterval(timerInterval);
            })
            .catch((error) => {
              console.error("Error:", error);
              document.querySelector(".count-display").textContent = "Error";
              document.querySelector(".status-indicator").textContent =
                "Error Occurred";
              document
                .querySelector(".status-indicator")
                .classList.remove("active");
              clearInterval(timerInterval);
            });
        });
    </script>
  </body>
</html>
